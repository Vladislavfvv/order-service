services:
  os_db:
    image: postgres:16
    container_name: os_db
    restart: always
    environment:
      POSTGRES_DB: os_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5434:5432"
    volumes:
      - os_pgdata:/var/lib/postgresql/data
      - ./docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d os_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  order-service:
    build: .
    image: order-service:latest
    container_name: order-service
    depends_on:
      os_db:
        condition: service_healthy
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://os_db:5432/os_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      SPRING_PROFILES_ACTIVE: docker
      JWT_SECRET: mySecretKeyForJWTGenerationInAuthenticationService2025
    ports:
      - "8083:8080"
    networks:
      - backend-network
    restart: always

volumes:
  os_pgdata:

networks:
  backend-network:
    name: backend-network
    external: true


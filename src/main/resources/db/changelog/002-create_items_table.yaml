databaseChangeLog:
  - changeSet:
      id: 2
      author: vlad
      changes:
        - createTable:
            tableName: items
            columns:
              - column:
                  name: id
                  type: bigserial
                  constraints:
                    primaryKey: true

              - column:
                  name: name
                  type: varchar(255)
                  constraints:
                    nullable: false

              - column:
                  name: price
                  type: Decimal(10,2)
                  constraints:
                    nullable: false

        - createIndex:
            tableName: items
            indexName: idx_items_name
            columns:
              - column:
                  name: name
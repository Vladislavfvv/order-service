# Test Configuration for OrderServiceApplicationTests
# Используется для тестов, которые требуют загрузки Spring контекста БЕЗ реальной БД
# 
# ВАЖНО: Интеграционные тесты (BaseIntegrationTest) используют @DynamicPropertySource
# и переопределяют эти настройки, поэтому Liquibase и DataSource будут включены для них.

# Отключаем Liquibase для тестов БЕЗ реальной БД (например, OrderServiceApplicationTests)
spring.liquibase.enabled=false
# Используем тот же путь к changelog, что и в основной программе (для единообразия)
spring.liquibase.change-log=classpath:/db/changelog/master-changelog.xml

# PostgreSQL (Testcontainers ????? ??????????? ???????? ????????)
spring.datasource.url=jdbc:postgresql://localhost:5432/testdb
spring.datasource.username=test
spring.datasource.password=test

# Отключаем автоконфигурацию DataSource только для OrderServiceApplicationTests
# Интеграционные тесты (BaseIntegrationTest) переопределяют это через @DynamicPropertySource
# spring.autoconfigure.exclude - убрано отсюда, добавлено в OrderServiceApplicationTests через @SpringBootTest(exclude)

# JWT Configuration (для тестов)
jwt.secret=test-secret-key-for-jwt-generation-in-order-service-tests

# User Service Configuration (мок URL для тестов)
user.service.url=http://localhost:9999
user.service.api-key=test-api-key

# Circuit Breaker Configuration (упрощенные настройки для тестов)
resilience4j.circuitbreaker.instances.userService.slidingWindowSize=5
resilience4j.circuitbreaker.instances.userService.registerHealthIndicator=false
resilience4j.circuitbreaker.instances.userService.minimumNumberOfCalls=2
resilience4j.circuitbreaker.instances.userService.permittedNumberOfCallsInHalfOpenState=2
resilience4j.circuitbreaker.instances.userService.automaticTransitionFromOpenToHalfOpenEnabled=true
resilience4j.circuitbreaker.instances.userService.waitDurationInOpenState=5s
resilience4j.circuitbreaker.instances.userService.failureRateThreshold=50
resilience4j.circuitbreaker.instances.userService.eventConsumerBufferSize=5

# WebClient timeout configuration (уменьшен для тестов)
spring.webflux.client.timeout=2s

# Отключаем Redis для тестов
spring.data.redis.repositories.enabled=false

# Kafka Configuration для тестов
# Отключаем автозапуск Kafka listeners для тестов (если Kafka не запущен)
spring.kafka.bootstrap-servers=${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
spring.kafka.consumer.auto-offset-reset=earliest
# Уменьшаем таймауты для быстрого завершения тестов
spring.kafka.producer.properties.delivery.timeout.ms=5000
spring.kafka.producer.properties.request.timeout.ms=5000
spring.kafka.producer.properties.metadata.max.age.ms=5000
spring.kafka.consumer.properties.session.timeout.ms=10000
spring.kafka.consumer.properties.heartbeat.interval.ms=3000
# Отключаем автозапуск Kafka listeners, если Kafka недоступен
spring.kafka.listener.auto-startup=false

user-service.base-url=http://localhost:9999

services:
  # База данных для order-service
  os_db:
    image: postgres:16
    container_name: os_db
    restart: always
    environment:
      POSTGRES_DB: os_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      # Внутри контейнера Postgres слушает на 5432, на хосте используем 5544,
      # чтобы не конфликтовать с общим стеком из gateway-service (postgres-order: 5434:5432)
      - "5544:5432"
    volumes:
      - os_db_data:/var/lib/postgresql/data
    networks:
      - backend-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d os_db"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  # Сервис заказов
  order-service:
    build: .
    container_name: order-service
    depends_on:
      os_db:
        condition: service_healthy
    environment:
      # Настройки подключения к PostgreSQL
      SPRING_DATASOURCE_URL: jdbc:postgresql://os_db:5432/os_db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres

      # Профиль Spring Boot
      SPRING_PROFILES_ACTIVE: docker

      # Конфигурация user-service для вызовов из UserServiceClient (WebClient)
      USER_SERVICE_URL: http://user-service:8080
    ports:
      - "8083:8080"
    networks:
      - backend-network
    restart: always

volumes:
  os_db_data:

networks:
  backend-network:
    name: backend-network
    external: true


